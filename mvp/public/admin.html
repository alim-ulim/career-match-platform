<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>울림 · 문의 관리</title><style>
:root{--ink:#203a30;--green:#255a44;--muted:#6b7972;--line:#dce4dc;--bg:#f6f8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.7 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);word-break:keep-all}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit}.notice{background:#e8eee3;padding:10px 25px;font-size:12px;text-align:center}header{padding:25px 35px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:700}.brand small{font-size:12px;color:var(--muted);font-weight:400;margin-left:15px}main{max-width:1350px;margin:auto;padding:35px}.intro{display:flex;justify-content:space-between;gap:20px}h1{font-size:28px;font-weight:600;margin:0}h2{font-size:22px;margin:8px 0}h3{font-size:15px;margin:20px 0 10px}.muted{color:var(--muted)}button{border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);padding:9px 14px}button.active,button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus,textarea:focus,select:focus,a:focus-visible{outline:2px solid #789c7d;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.stat{background:white;border:1px solid var(--line);padding:20px;border-radius:7px}.stat strong{font-size:28px;display:block;font-weight:500}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.toolbar input{padding:10px 14px;min-width:240px;margin-left:auto;border:1px solid var(--line);border-radius:5px}.layout{display:grid;grid-template-columns:340px 1fr;gap:22px}.queue,.detail{background:white;border:1px solid var(--line);border-radius:8px}.queue{align-self:start;padding:12px}.item{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 13px;border-radius:4px}.item.selected{background:#eef3e9;box-shadow:inset 3px 0 #54764b}.item b{display:block;font-size:15px;margin:8px 0}.item small{color:var(--muted)}.badge{font-size:11px;padding:4px 8px;border-radius:4px;background:#eef1ec;display:inline-block}.detail{padding:28px}.meta{display:flex;justify-content:space-between;gap:15px}.detail p{margin:8px 0}.box{padding:18px 20px;background:#f5f7f2;border-radius:4px;margin:14px 0}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}textarea,select{width:100%;border:1px solid #cfd9cc;border-radius:5px;padding:11px;background:white;color:var(--ink)}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap}.history{padding:0;list-style:none}.history li{padding:12px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.result{padding:12px;background:#eef3e9;margin-top:15px;font-size:13px}.empty{padding:35px;color:var(--muted)}.reply{white-space:pre-wrap;font-size:13px}.fine{font-size:12px;color:var(--muted)}@media(max-width:800px){main{padding:22px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar input{width:100%;margin-left:0}.intro{display:block}header{padding:20px}.brand small{display:block;margin:0}.detail{padding:22px}}
[hidden]{display:none!important}@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style></head><body><div class="notice">울림 운영자 전용 · 문의 내용은 권한 있는 담당자만 확인합니다.</div><header><div class="brand">울림 <small>문의 관리</small></div><a href="/">홈페이지로 ↗</a></header><section id="login-panel" style="max-width:440px;margin:70px auto;padding:30px;background:white;border:1px solid #dce4dc;border-radius:8px"><h1>운영자 로그인</h1><p class="muted">문의 검토 권한이 있는 담당자만 접근할 수 있습니다.</p><form id="login-form"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required style="width:100%;padding:12px;margin:12px 0;border:1px solid #cfd8cf"><button class="primary" type="submit">로그인</button><p id="login-message" role="status"></p></form></section><main id="workspace" hidden><div class="intro"><div><h1>문의에서 다음 연결까지</h1><p class="muted">접수된 문의의 내용·검토 사항·회신 초안을 관리합니다.</p></div><div><a class="btn" href="/admin/platform">전문가·상담 관리</a> <a href="/admin/backup">데이터 백업</a> <button id="refresh">목록 새로고침</button> <button id="logout">로그아웃</button></div></div><div class="stats" id="stats"></div><div class="toolbar" id="filters"><button data-type="all" class="active">전체</button><button data-type="customer">상담 고객</button><button data-type="expert">전문가</button><button data-type="company">기업</button><input id="search" aria-label="문의 제목 검색" placeholder="문의 제목·번호 검색"></div><div class="layout"><aside class="queue" id="queue" aria-label="문의 목록"></aside><section class="detail" id="detail" aria-label="문의 검토"></section></div><p class="fine">회신 초안은 저장만 됩니다. 이메일 발송은 담당자가 확인 후 별도로 진행합니다. 문의 정보와 내부 메모를 외부에 공유하지 마세요.</p></main><script>
const labels={customer:'상담 고객',expert:'전문가',company:'기업'};const stages=['접수','검토 중','추가 확인 필요','조건 안내 준비','종료'];const checkLabels={customer:['핵심 질문이 구체적인가','답할 수 있는 직접 경험이 있는가','제공 범위와 한계를 안내할 수 있는가'],expert:['경험과 상담 주제를 확인했는가','경력 확인·샘플 상담 계획을 확인했는가','겸업·공개 범위·보상을 확인했는가'],company:['역할과 필수 경험을 확인했는가','전문가와 진행 가능성을 확인했는가','계약·공유 범위 협의 사항을 확인했는가']};const fieldLabels={role:'현재 업무',topic:'상담 주제',question:'핵심 질문',attempt:'기존 시도',timing:'결정 시점',field:'경험 분야',experience:'담당 업무·경험',topics:'상담 가능한 질문',method:'상담 방식',availability:'가능 시간',company:'기업·팀 소개',position:'채용 직무',responsibility:'핵심 업무·경험',difficulty:'채용 어려움',deadline:'채용 시점'};
let csrf='',records=[],selected=null,type='all',query='';const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
async function api(url,options={}){const res=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...options.headers},signal:AbortSignal.timeout(15000)});let result;try{result=await res.json()}catch{throw Error('서버 응답을 확인하지 못했습니다.')}if(res.status===401){document.querySelector('#workspace').hidden=true;document.querySelector('#login-panel').hidden=false;}if(!res.ok)throw Error(result.error||'처리하지 못했습니다.');return result;}
async function load(){const data=await api('/api/admin/inquiries');records=data.items;if(!records.some(r=>r.id===selected))selected=records[0]?.id;render()}
function render(){document.querySelector('#stats').replaceChildren(...[['전체 문의',records.length],['검토 전',records.filter(r=>r.status==='접수').length],['검토·확인 중',records.filter(r=>['검토 중','추가 확인 필요'].includes(r.status)).length],['조건 안내 준비',records.filter(r=>r.status==='조건 안내 준비').length]].map(([k,v])=>{const d=el('div',undefined,'stat');d.append(el('span',k),el('strong',String(v)));return d}));const filtered=records.filter(r=>(type==='all'||r.type===type)&&JSON.stringify([r.id,r.name,r.payload]).toLowerCase().includes(query.toLowerCase()));const q=document.querySelector('#queue');q.replaceChildren();if(!filtered.length)q.append(el('p','조건에 맞는 문의가 없습니다.','empty'));filtered.forEach(r=>{const b=el('button',undefined,'item'+(selected===r.id?' selected':''));const title=r.payload.question||r.payload.topics||r.payload.position||'문의';b.append(el('span',labels[r.type]+' · '+r.status,'badge'),el('b',title.slice(0,65)),el('small',r.id+' / '+r.name));b.onclick=()=>{selected=r.id;render()};q.append(b)});const d=document.querySelector('#detail');d.replaceChildren();const r=filtered.find(r=>r.id===selected);if(!r){d.append(el('p','목록에서 문의를 선택하세요.','empty'));return}d.append(el('span',labels[r.type]+' · '+r.id,'badge'),el('h2',r.name+'님의 문의'),el('p',r.email),el('p',new Date(r.created_at).toLocaleString('ko-KR'),'fine'));Object.entries(r.payload).filter(([k,v])=>v).forEach(([k,v])=>{const box=el('div',undefined,'box');box.append(el('b',fieldLabels[k]||k),el('p',v));d.append(box)});d.append(el('h3','검토 확인 항목'));const checks=r.checks.length===3?r.checks:[false,false,false];checkLabels[r.type].forEach((text,i)=>{const label=el('label');label.style.display='block';const c=document.createElement('input');c.type='checkbox';c.className='check';c.checked=checks[i];label.append(c,document.createTextNode(' '+text));d.append(label)});function field(title,id,value,kind='textarea'){const div=el('div',undefined,'field');const label=el('label',title);label.htmlFor=id;const input=document.createElement(kind);input.id=id;input.maxLength=4000;if(kind==='select')stages.forEach(s=>{const o=el('option',s);o.value=s;input.append(o)});input.value=value;div.append(label,input);return div}d.append(field('비공개 검토 메모','note',r.note),field('처리 상태','status',r.status,'select'),field('회신 초안 · 저장만 되며 발송되지 않습니다','reply',r.reply));const actions=el('div',undefined,'actions');const save=el('button','검토 내용 저장','primary');save.onclick=async()=>{save.disabled=true;try{const b={status:document.querySelector('#status').value,note:document.querySelector('#note').value,reply:document.querySelector('#reply').value,checks:[...document.querySelectorAll('.check')].map(x=>x.checked),version:r.version};await api('/api/admin/inquiries/'+r.id,{method:'PATCH',body:JSON.stringify(b)});await load();show('저장했습니다. 회신은 발송되지 않았습니다.')}catch(e){show(e.message);save.disabled=false}};const preview=el('button','회신 초안 보기');preview.onclick=()=>{const box=document.querySelector('#reply-preview');box.hidden=false;box.textContent=document.querySelector('#reply').value||'회신 내용을 입력해주세요.'};actions.append(save,preview);d.append(actions);const status=el('p');status.id='result';status.setAttribute('role','status');d.append(status);const box=el('div',undefined,'box reply');box.hidden=true;box.id='reply-preview';d.append(box,el('h3','처리 이력'));const ul=el('ul',undefined,'history');r.history.forEach(h=>ul.append(el('li',new Date(h.at).toLocaleString('ko-KR')+' · '+h.action)));d.append(ul)}function show(t){const n=document.querySelector('#result');if(n){n.className='result';n.textContent=t}else alert(t)}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;selected=records.find(r=>type==='all'||r.type===type)?.id;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#search').oninput=e=>{query=e.target.value;render()};document.querySelector('#refresh').onclick=()=>load().catch(e=>show(e.message));document.querySelector('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'});csrf='';records=[];document.querySelector('#workspace').hidden=true;document.querySelector('#detail').replaceChildren();document.querySelector('#queue').replaceChildren();document.querySelector('#login-panel').hidden=false;}catch(e){show(e.message)}};document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const message=document.querySelector('#login-message');message.textContent='로그인 중…';try{const result=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});csrf=result.csrf;document.querySelector('#password').value='';await load();document.querySelector('#login-panel').hidden=true;document.querySelector('#workspace').hidden=false;message.textContent='';}catch(e){message.textContent=e.message}};
(async()=>{try{csrf=(await api('/api/admin/session')).csrf;await load();document.querySelector('#login-panel').hidden=true;document.querySelector('#workspace').hidden=false;}catch{}})();
</script></body></html>
